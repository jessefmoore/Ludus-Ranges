# updated for Ludus v2
# ludus range create -n CTFd -r CTFd
# ludus ansible role add PrymalInstynct.ludus_ctfd --user CTFd 
# ludus ansible role add geerlingguy.docker --user CTFd
# ludus range config set -f ctfd.yml --user CTFd
# ludus range deploy --user CTFd
#
ludus:
  - vm_name: "{{ range_id }}-ctfd"
    hostname: "{{ range_id }}-ctfd"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 100
    ram_gb: 4
    cpus: 2
    linux: true
    roles:
      - geerlingguy.docker
      - PrymalInstynct.ludus_ctfd
