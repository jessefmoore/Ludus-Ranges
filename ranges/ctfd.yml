# updated for Ludus v2
# ludus range create -n CTFD -r CTFD
# ludus ansible role add PrymalInstynct.ludus_ctfd -r CTFD 
# ludus ansible role add geerlingguy.docker -r CTFD
# ludus range config set -f ctfd.yml -r CTFD
# ludus range deploy -r CTFD
# ludus range logs -r CTFD -f
#
ludus:
  - vm_name: "{{ range_id }}-ctfd"
    hostname: "{{ range_id }}-ctfd"
    template: debian-12-x64-server-template
    vlan: 10
    ip_last_octet: 100
    ram_gb: 4
    cpus: 2
    linux: true
    roles:
      - geerlingguy.docker
      - PrymalInstynct.ludus_ctfd
